[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "system-resources-monitoring"
version = "0.1.0"
description = "Host resource monitoring for SEbuntu AI applications"
requires-python = ">=3.11"

[project.scripts]
system-resources-monitoring = "system_resources_monitoring.monitor:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["system_resources_monitoring*"]
